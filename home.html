<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>من قريب | الرئيسية</title>
<style>
@font-face{font-family:Effra;src:url("./fonts/effra-trial-bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
:root{--green:#173f3a;--cream:#f7f1e8;--soft:#eee5d8;--text:#173f3a;--gold:#b88a43;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--text);font-family:Effra,Arial,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer}
body{min-height:100vh}
.page{max-width:1180px;margin:auto;padding-bottom:86px}

/* Header */
.header{position:sticky;top:0;z-index:50;background:rgba(247,241,232,.96);backdrop-filter:blur(10px);padding:14px 18px 10px;border-bottom:1px solid rgba(23,63,58,.08)}
.header-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.brand{text-align:center}
.brand-name{font-size:28px;line-height:1}
.brand-tag{font-family:Arial,sans-serif;font-size:11px;margin-top:4px;opacity:.72}
.side{display:flex;align-items:center;gap:10px}
.side.left{justify-content:flex-start}
.side.right{justify-content:flex-end}
.icon-btn{width:43px;height:43px;border-radius:50%;background:var(--white);color:var(--green);display:grid;place-items:center;position:relative;box-shadow:0 2px 10px rgba(23,63,58,.08);transition:.18s}
.icon-btn:active{transform:scale(.96);background:var(--green);color:white}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-3px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:20px;background:var(--gold);color:white;font:700 11px Arial;display:grid;place-items:center}

/* Search */
.search-wrap{padding:12px 18px 2px}
.search{height:51px;background:white;border:1px solid rgba(23,63,58,.08);border-radius:28px;display:flex;align-items:center;padding:0 17px;gap:10px;box-shadow:0 3px 12px rgba(23,63,58,.04)}
.search svg{width:21px;height:21px;stroke:var(--green);fill:none;stroke-width:1.8}
.search input{border:0;outline:0;background:transparent;width:100%;font-family:Arial,sans-serif;color:var(--text);font-size:14px}
.search input::placeholder{color:#8b918d}

/* Hero */
.hero{margin:18px;border-radius:28px;overflow:hidden;min-height:300px;background:linear-gradient(100deg,#d9c5a9,#eee2d2);position:relative;display:flex;align-items:center}
.hero-art{position:absolute;inset:0;background:
radial-gradient(circle at 78% 50%,rgba(255,255,255,.7),transparent 31%),
linear-gradient(90deg,rgba(23,63,58,.04),rgba(23,63,58,.12));}
.hero-content{position:relative;z-index:2;width:52%;padding:38px 42px}
.hero-kicker{font-family:Arial,sans-serif;font-size:14px;margin-bottom:8px}
.hero-title{font-size:40px;line-height:1.08;margin:0 0 12px}
.hero-text{font-family:Arial,sans-serif;font-size:15px;line-height:1.8;margin:0 0 20px;max-width:430px}
.primary{background:var(--green);color:white;border-radius:28px;padding:13px 28px;transition:.18s}
.primary:active{transform:scale(.97);background:#102f2b}
.hero-circle{position:absolute;width:270px;height:270px;border-radius:50%;background:rgba(255,255,255,.34);left:9%;bottom:-70px}
.hero-box{position:absolute;left:12%;bottom:35px;width:190px;height:125px;border-radius:18px;background:#d7c09e;box-shadow:0 18px 35px rgba(0,0,0,.12);transform:rotate(-6deg)}
.hero-box:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);background:rgba(255,255,255,.62)}
.hero-box:after{content:"من قريب";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(6deg);font-size:17px;color:var(--green);white-space:nowrap}
.dots{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);display:flex;gap:5px;direction:ltr}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(23,63,58,.28)}
.dot.active{width:22px;border-radius:8px;background:var(--green)}

/* Sections */
.section{padding:0 18px;margin-top:25px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:24px;margin:0;display:flex;align-items:center;gap:8px}
.section-title:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.more{background:none;color:var(--green);font-size:14px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.category{background:#fbf7f0;border:1px solid rgba(23,63,58,.07);border-radius:20px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--green);box-shadow:0 3px 12px rgba(23,63,58,.035);transition:.18s}
.category:active{transform:scale(.98);background:var(--green);color:white}
.cat-icon{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.cat-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cat-name{font-size:15px}

/* Products */
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:white;border-radius:21px;overflow:hidden;border:1px solid rgba(23,63,58,.07);box-shadow:0 4px 15px rgba(23,63,58,.045)}
.product-img{height:185px;background:linear-gradient(135deg,#eee5d8,#faf7f2);position:relative;display:grid;place-items:center}
.product-img .placeholder{width:105px;height:125px;border-radius:17px;background:#d9c5a9;box-shadow:0 12px 22px rgba(0,0,0,.08);position:relative}
.product-img .placeholder:after{content:"من قريب";position:absolute;inset:0;display:grid;place-items:center;font-size:14px;transform:rotate(-8deg)}
.heart{position:absolute;top:10px;left:10px;width:35px;height:35px;border-radius:50%;background:white;display:grid;place-items:center;color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.heart svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
.sale{position:absolute;top:10px;right:10px;background:var(--green);color:white;border-radius:15px;padding:5px 9px;font-family:Arial;font-size:10px}
.card-body{padding:13px}
.product-name{font-size:16px;margin-bottom:7px}
.rating{font-family:Arial;font-size:12px;color:var(--gold);margin-bottom:8px}
.price{display:flex;align-items:center;gap:7px;margin-bottom:11px}
.current{font-size:18px}
.old{text-decoration:line-through;color:#999;font:12px Arial}
.add{width:100%;height:42px;border-radius:22px;background:var(--green);color:white;transition:.18s}
.add:active{transform:scale(.98);background:#102f2b}

/* Bottom nav */
.bottom{position:fixed;z-index:60;bottom:0;left:50%;transform:translateX(-50%);width:min(1180px,100%);height:72px;background:rgba(255,255,255,.97);border-top:1px solid rgba(23,63,58,.08);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 10px env(safe-area-inset-bottom)}
.nav-item{background:none;color:#7d8580;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:11px Arial}
.nav-item.active{color:var(--green)}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:760px){
.page{padding-bottom:80px}
.header{padding-top:11px}
.brand-name{font-size:24px}
.brand-tag{font-size:9px}
.icon-btn{width:39px;height:39px}
.search-wrap{padding-top:10px}
.hero{margin:14px 14px 20px;min-height:305px;border-radius:25px}
.hero-content{width:62%;padding:28px 24px}
.hero-title{font-size:31px}
.hero-text{font-size:13px;line-height:1.7}
.hero-circle{width:205px;height:205px;left:-15%;bottom:-55px}
.hero-box{left:-2%;bottom:25px;width:150px;height:100px}
.categories{grid-template-columns:repeat(2,1fr)}
.products{grid-template-columns:repeat(2,1fr);gap:10px}
.product-img{height:155px}
.section{padding:0 14px}
.section-title{font-size:21px}
}
@media(max-width:390px){
.hero-content{width:68%;padding:25px 19px}
.hero-title{font-size:28px}
.hero-box{left:-10%;transform:scale(.85) rotate(-6deg)}
}
</style>
</head>
<body>
<div class="page">
<header class="header">
  <div class="header-row">
    <div class="side left">
      <button class="icon-btn" onclick="openCart()" aria-label="السلة">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
        <span class="badge" id="cartCount">0</span>
      </button>
    </div>
    <div class="brand">
      <div class="brand-name">من قريب</div>
      <div class="brand-tag">كل ما تحتاجه .. أقرب إليك</div>
    </div>
    <div class="side right">
      <button class="icon-btn" onclick="support()" aria-label="خدمة العملاء">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12v5a2 2 0 0 0 2 2h2v-6H4zm16 0v5a2 2 0 0 1-2 2h-2v-6h4z"/><path d="M14 19h2"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="search-wrap">
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="searchInput" type="search" placeholder="ابحث عن منتج..." oninput="searchProducts()">
  </div>
</div>

<section class="hero">
  <div class="hero-art"></div>
  <div class="hero-content">
    <div class="hero-kicker">اختيارات قريبة منك</div>
    <h1 class="hero-title">كل ما تحتاجه<br>أقرب إليك</h1>
    <p class="hero-text">تسوّق منتجاتك المفضلة بسهولة، واكتشف عروضًا مختارة بعناية.</p>
    <button class="primary" onclick="scrollToProducts()">تسوق الآن</button>
  </div>
  <div class="hero-circle"></div><div class="hero-box"></div>
  <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
</section>

<section class="section">
  <div class="section-head"><h2 class="section-title">تصفح الأقسام</h2><button class="more" onclick="showMoreCategories()">عرض المزيد</button></div>
  <div class="categories" id="categories">
    <button class="category"><span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M4 10h16l-1 10H5L4 10z"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/><path d="M9 14h6"/></svg></span><span class="cat-name">أزياء</span></button>
    <button class="category"><span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></span><span class="cat-name">إلكترونيات</span></button>
    <button class="category"><span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M4 9h16v11H4z"/><path d="M6 9V5h12v4M8 13h8M8 16h5"/></svg></span><span class="cat-name">منزل</span></button>
    <button class="category"><span class="cat-icon"><svg viewBox="0 0 24 24"><path d="M7 5h10l2 4-2 10H7L5 9l2-4z"/><path d="M9 9a3 3 0 0 0 6 0"/></svg></span><span class="cat-name">عناية</span></button>
  </div>
</section>

<section class="section" id="productsSection">
  <div class="section-head"><h2 class="section-title">أبرز المنتجات</h2><button class="more" onclick="showAll()">عرض الكل</button></div>
  <div class="products" id="products">
    <article class="card" data-name="حقيبة أنيقة"><div class="product-img"><button class="heart" aria-label="المفضلة"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.7z"/></svg></button><span class="sale">الأكثر مبيعاً</span><span class="placeholder"></span></div><div class="card-body"><div class="product-name">حقيبة أنيقة</div><div class="rating">★★★★★</div><div class="price"><span class="current">120 ل.س</span><span class="old">150 ل.س</span></div><button class="add" onclick="addToCart()">أضف إلى السلة</button></div></article>
    <article class="card" data-name="عطر فاخر"><div class="product-img"><button class="heart" aria-label="المفضلة"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.7z"/></svg></button><span class="placeholder"></span></div><div class="card-body"><div class="product-name">عطر فاخر</div><div class="rating">★★★★★</div><div class="price"><span class="current">95 ل.س</span></div><button class="add" onclick="addToCart()">أضف إلى السلة</button></div></article>
    <article class="card" data-name="ساعة أنيقة"><div class="product-img"><button class="heart" aria-label="المفضلة"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.7z"/></svg></button><span class="sale">جديد</span><span class="placeholder"></span></div><div class="card-body"><div class="product-name">ساعة أنيقة</div><div class="rating">★★★★★</div><div class="price"><span class="current">180 ل.س</span></div><button class="add" onclick="addToCart()">أضف إلى السلة</button></div></article>
    <article class="card" data-name="قطعة منزلية"><div class="product-img"><button class="heart" aria-label="المفضلة"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.7z"/></svg></button><span class="placeholder"></span></div><div class="card-body"><div class="product-name">قطعة منزلية</div><div class="rating">★★★★★</div><div class="price"><span class="current">75 ل.س</span></div><button class="add" onclick="addToCart()">أضف إلى السلة</button></div></article>
  </div>
</section>
</div>

<nav class="bottom">
  <button class="nav-item active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button class="nav-item" onclick="alert('صفحة الأقسام قيد التجهيز')"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>الأقسام</button>
  <button class="nav-item" onclick="document.getElementById('searchInput').focus()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>البحث</button>
  <button class="nav-item" onclick="alert('المفضلة قيد التجهيز')"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8.8 2.7z"/></svg>المفضلة</button>
  <button class="nav-item" onclick="alert('الحساب قيد التجهيز')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>حسابي</button>
</nav>

<script>
let cart=0;
function addToCart(){cart++;document.getElementById('cartCount').textContent=cart}
function openCart(){alert(cart?'السلة تحتوي على '+cart+' منتج':'السلة فارغة')}
function support(){alert('خدمة العملاء قيد التجهيز')}
function scrollToProducts(){document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})}
function showMoreCategories(){alert('صفحة جميع الأقسام قيد التجهيز')}
function showAll(){document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})}
function searchProducts(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 document.querySelectorAll('.card').forEach(c=>c.style.display=!q||c.dataset.name.toLowerCase().includes(q)?'block':'none')
}
</script>
</body>
</html>
